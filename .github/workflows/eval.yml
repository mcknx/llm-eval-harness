name: eval
on: [push, pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The gate: exits 1 (and fails the PR) when quality drops. Summary lands on the job page.
      - run: npm run eval
      # Proof the gate bites: the regressed recording must fail it.
      - run: "! npm run eval -- regressed"
